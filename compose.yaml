services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongo:27017",
        "--eval",
        "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }",
      ]
  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/resumeroast?replicaSet=rs0
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
    ports: ["5001:5001"]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
  worker:
    build: .
    command: ["node", "server/src/worker.js"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/resumeroast?replicaSet=rs0
      NODE_ENV: development
    depends_on:
      mongo-init: { condition: service_completed_successfully }
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports: ["5173:80"]
volumes:
  mongo-data:
